# Pipeline manuelle Control-M JSON -> Excel.
#
# Une source commune, un nom/masque ou une liste séparée par des virgules.
# Les noms et l’existence des fichiers sont validés avant le nettoyage unique.
# Le contenu de chaque JSON est analysé lors de sa conversion.
# Un appel Python par JSON, dans l’ordre retenu, avec arrêt au premier échec.
#
# Sorties par export : hiérarchie, vue à plat, synthèse et bilans JSON/TXT.
# mergeExcel ajoute trois classeurs consolidés après succès de tous les appels.
# generation-info.txt récapitule le run ; l’artifact n’est publié qu’en cas de succès.
#
# GitHub : main pour les sources. Azure DevOps : integration pour l’exécution.
# Script attendu : cipipeline/ctm_to_excel/ctm_json_to_excel.py.
# Le détail des formats, des contrôles et des huit sources figure dans README.md.

trigger: none
pr: none

# -----------------------------------------------------------------------------
# Paramètres visibles dans l'écran "Run pipeline"
# -----------------------------------------------------------------------------
parameters:
- name: sourceJsonControlM
  displayName: 'Source JSON Control-M'
  type: string
  default: 'DEV BUILD'
  values:
  - 'DEV BUILD'
  - 'PPRD BUILD'
  - 'QAL BUILD'
  - 'PROD BUILD'
  - 'DEV SMARTFOLDER'
  - 'PPRD SMARTFOLDER'
  - 'QAL SMARTFOLDER'
  - 'PROD SMARTFOLDER'

- name: jsonFile
  displayName: 'JSON à analyser (noms ou masques séparés par des virgules)'
  type: string
  # Valeur pratique par défaut : traite tous les JSON du répertoire choisi.
  # Pour une CLM précise, saisir par exemple : CLM-200-PRD.json
  default: '*.json'

- name: mergeExcel
  displayName: 'Consolider les Excel de tous les JSON'
  type: boolean
  default: false

# -----------------------------------------------------------------------------
# Agent
# -----------------------------------------------------------------------------
# La pipeline utilise Bash ; un pool de remplacement doit fournir cet environnement.
pool:
  vmImage: 'ubuntu-latest'

# -----------------------------------------------------------------------------
# Variables communes
# -----------------------------------------------------------------------------
variables:
  # Chemin relatif au repository du script Python.
  pythonScript: 'cipipeline/ctm_to_excel/ctm_json_to_excel.py'

  # Dossier dédié aux classeurs et bilans, nettoyé une seule fois par run.
  excelOutputDirectory: '$(Build.ArtifactStagingDirectory)/controlm-excel'

  # ---------------------------------------------------------------------------
  # Mapping du paramètre "Source JSON Control-M" vers le répertoire du repo.
  # Les expressions ${{ if ... }} sont évaluées AVANT l'exécution du job.
  # ---------------------------------------------------------------------------
  ${{ if eq(parameters.sourceJsonControlM, 'DEV BUILD') }}:
    sourceDirectory: 'build/dev'

  ${{ if eq(parameters.sourceJsonControlM, 'PPRD BUILD') }}:
    sourceDirectory: 'build/pep'

  ${{ if eq(parameters.sourceJsonControlM, 'QAL BUILD') }}:
    sourceDirectory: 'build/qaf'

  ${{ if eq(parameters.sourceJsonControlM, 'PROD BUILD') }}:
    sourceDirectory: 'build/prd'

  ${{ if eq(parameters.sourceJsonControlM, 'DEV SMARTFOLDER') }}:
    sourceDirectory: 'src/smartfolder/dev'

  ${{ if eq(parameters.sourceJsonControlM, 'PPRD SMARTFOLDER') }}:
    sourceDirectory: 'src/smartfolder/pep'

  ${{ if eq(parameters.sourceJsonControlM, 'QAL SMARTFOLDER') }}:
    sourceDirectory: 'src/smartfolder/qaf'

  ${{ if eq(parameters.sourceJsonControlM, 'PROD SMARTFOLDER') }}:
    sourceDirectory: 'src/smartfolder/prd'

steps:
# =============================================================================
# ETAPE 0 - Protection de branche
# =============================================================================
# Le pipeline est volontairement autorisé UNIQUEMENT depuis la branche
# integration. Même si un utilisateur sélectionne manuellement main dans
# l'écran "Run pipeline", l'exécution s'arrête ici avant le checkout du repo.
#
# Remarque : Azure DevOps crée quand même un run pour effectuer ce contrôle,
# mais aucune étape métier (checkout, lecture JSON, Python, génération Excel)
# n'est exécutée sur une autre branche.
- bash: |
    set -euo pipefail

    echo "Branche demandée : $(Build.SourceBranch)"

    if [[ "$(Build.SourceBranch)" != "refs/heads/integration" ]]; then
      echo "##vso[task.logissue type=error]Cette pipeline ne peut être exécutée que depuis la branche integration."
      echo "Branche actuelle : $(Build.SourceBranch)"
      exit 1
    fi

    echo "OK : branche integration autorisée."
  displayName: 'Vérifier la branche integration'

# =============================================================================
# ETAPE 1 - Récupérer le repository
# =============================================================================
# Cette étape n'est atteinte que si le contrôle précédent a réussi.
- checkout: self
  clean: true
  displayName: 'Checkout du repository'

# =============================================================================
# ETAPE 2 - Préparer Python
# =============================================================================
# La même version mineure de Python est utilisée pour toutes les conversions.
- task: UsePythonVersion@0
  displayName: 'Préparer Python 3.11'
  inputs:
    versionSpec: '3.11'
    addToPath: true

# =============================================================================
# ETAPE 3 - Installer la dépendance du script
# =============================================================================
# openpyxl est la seule bibliothèque Python externe nécessaire à la création des
# classeurs XLSX.
- bash: |
    set -euo pipefail
    python -m pip install --upgrade pip
    python -m pip install openpyxl
  displayName: 'Installer openpyxl'

# =============================================================================
# ETAPE 4 - Validation, conversions, consolidation et bilan global
# =============================================================================
# Les paramètres transitent par env, jamais par interpolation dans du code shell.
# subprocess.run(check=True) arrête le run dès le premier échec Python.
- bash: |
    set -euo pipefail
    python - <<'PYTHON'
    import fnmatch
    import importlib.util
    import json
    import os
    import shutil
    import subprocess
    import sys
    import time
    from datetime import datetime, timezone
    from pathlib import Path

    source = Path(os.environ["SOURCE_DIR"]).resolve()
    script = Path(os.environ["SCRIPT_PATH"]).resolve()
    output_raw = Path(os.environ["OUTPUT_DIR"])
    output = output_raw.resolve()
    staging = Path(os.environ["STAGING_DIR"]).resolve()
    selection = os.environ["JSON_SELECTION"]
    merge = os.environ["MERGE_EXCEL"].lower() == "true"

    if not source.is_dir():
        raise SystemExit(f"Répertoire source introuvable : {source}")
    if not script.is_file():
        raise SystemExit(f"Script Python introuvable : {script}")
    # Le nettoyage reste strictement dans le dossier d'artefacts dédié.
    if (output_raw.is_symlink() or output == staging or staging not in output.parents
            or output == source or output in source.parents or output in script.parents):
        raise SystemExit(f"Dossier de sortie non autorisé : {output}")

    selected = []
    seen = set()
    errors = []
    entries = selection.split(",")
    for position, raw in enumerate(entries, 1):
        name = raw.strip()
        if (not name or ".." in name or any(c in name for c in "/\\:")
                or any(ord(c) < 32 or ord(c) == 127 for c in name)
                or not name.lower().endswith(".json")):
            errors.append(f"Entrée {position} invalide : {name!r} (nom ou masque .json uniquement)")
            continue
        # Nom exact prioritaire ; sinon masque compatible avec les anciens usages.
        exact = source / name
        if exact.exists() or exact.is_symlink():
            matches = [exact]
        elif any(c in name for c in "*?["):
            matches = sorted((p for p in source.iterdir()
                              if fnmatch.fnmatchcase(p.name, name)), key=lambda p: p.name)
        else:
            matches = []
        if not matches:
            errors.append(f"Aucun fichier trouvé pour : {name}")
        for path in matches:
            if (path.is_symlink() or not path.is_file()
                    or path.resolve().parent != source
                    or not path.name.lower().endswith(".json")):
                errors.append(f"Fichier non autorisé : {path.name}")
                continue
            if path.name not in seen:
                seen.add(path.name)
                selected.append(path)
    if errors:
        raise SystemExit("Validation des JSON échouée :\n- " + "\n- ".join(errors))
    if not selected:
        raise SystemExit("Aucun JSON sélectionné.")

    print(f"Source : {os.environ['SOURCE_LABEL']}", flush=True)
    print(f"{len(selected)} JSON validé(s) : " + ", ".join(p.name for p in selected), flush=True)
    # Tous les noms et fichiers sont validés AVANT nettoyage et conversion.
    # Un seul nettoyage pour le run, jamais dans la boucle.
    if output.exists():
        shutil.rmtree(output)
    output.mkdir(parents=True)
    exports = []
    reports = []
    consolidated = []
    started_at = datetime.now(timezone.utc).isoformat()
    started = time.perf_counter()
    run_error = None
    current_name = None
    try:
        for index, path in enumerate(selected, 1):
            current_name = path.name
            destination = output / path.name  # extension .json incluse
            destination.mkdir()
            report_path = destination / f"{path.stem}_generation-info.json"
            print(f"JSON {index}/{len(selected)} : {path.name}", flush=True)
            try:
                subprocess.run([
                    sys.executable, str(script), str(path),
                    "--output", str(destination / f"{path.stem}_hierarchie.xlsx"),
                    "--flat-output", str(destination / f"{path.stem}_ligne.xlsx"),
                    "--summary-output", str(destination / f"{path.stem}_synthese.xlsx"),
                    "--report-output", str(report_path),
                ], check=True)
            finally:
                # Le convertisseur peut laisser un bilan utile même en cas d’échec.
                if report_path.is_file():
                    reports.append(json.loads(report_path.read_text(encoding="utf-8")))
            exports.append((path.name, destination))
        current_name = None
        # Ne consolider que les sorties de CE run, après succès de tous les appels.
        if merge:
            spec = importlib.util.spec_from_file_location("ctm_excel", script)
            module = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(module)
            for path in module.merge_excel_exports(exports, output / "CONSOLIDE"):
                consolidated.append(str(path.relative_to(output)))
                print(f"Consolidation : {path.relative_to(output)}", flush=True)
    except Exception as exc:
        run_error = str(exc)
        raise
    finally:
        # Bilan écrit même si un appel ou la consolidation échoue ; aucun appel suivant.
        warning_count = sum(len(r["warnings"]) for r in reports)
        status = "ECHEC" if run_error else ("OK_AVEC_AVERTISSEMENTS" if warning_count else "OK")
        totals = {key: sum(r["counts"][key] for r in reports) for key in ("Folder", "SubFolder", "Job", "Total")}
        lines = [
            "Bilan de génération Control-M", f"Statut : {status}",
            f"Source : {os.environ['SOURCE_LABEL']}", f"Sélection : {selection}",
            f"Début (UTC) : {started_at}", f"Fin (UTC) : {datetime.now(timezone.utc).isoformat()}",
            f"Durée : {time.perf_counter() - started:.3f} s",
            f"JSON sélectionnés : {len(selected)} ; conversions réussies : {len(exports)}",
            "Objets analysés : " + ", ".join(f"{k}={v}" for k, v in totals.items()),
            f"Définitions incomplètes : {warning_count}", f"Consolidation demandée : {merge}",
        ]
        by_name = {r["source_json"]: r for r in reports}
        completed = {name for name, _ in exports}
        for path in selected:
            report = by_name.get(path.name)
            state = report["status"] if report else ("ECHEC" if path.name == current_name else "NON_TRAITE")
            if path.name == current_name and run_error and path.name not in completed:
                state = "ECHEC"
            lines.append(f"JSON : {path.name} : {state}")
            if report:
                lines.append("  Objets : " + ", ".join(f"{k}={v}" for k, v in report["counts"].items()))
                lines.extend(f"  AVERTISSEMENT : {w['path']} ({w['type']}) : {w['message']}" for w in report["warnings"])
                lines.extend(f"  Fichier : {Path(f).relative_to(output)}" for f in report["outputs"])
                if report.get("error"):
                    lines.append("  ERREUR : " + report["error"])
        lines.extend(f"Classeur consolidé : {f}" for f in consolidated)
        if run_error:
            lines.append("ERREUR DU RUN : " + run_error)
        text = "\n".join(lines) + "\n"
        (output / "generation-info.txt").write_text(text, encoding="utf-8")
        print(text, flush=True)
    print("Génération terminée.", flush=True)
    PYTHON
  displayName: 'Valider et traiter les JSON puis consolider si demandé'
  env:
    SOURCE_DIR: '$(Build.SourcesDirectory)/$(sourceDirectory)'
    SOURCE_LABEL: ${{ parameters.sourceJsonControlM }}
    SCRIPT_PATH: '$(Build.SourcesDirectory)/$(pythonScript)'
    OUTPUT_DIR: '$(excelOutputDirectory)'
    STAGING_DIR: '$(Build.ArtifactStagingDirectory)'
    JSON_SELECTION: ${{ parameters.jsonFile }}
    MERGE_EXCEL: '${{ parameters.mergeExcel }}'

# =============================================================================
# ETAPE 5 - Publier les classeurs et bilans en cas de succès
# =============================================================================
# PublishBuildArtifacts@1 fonctionne avec Azure Pipelines / Azure DevOps Server.
# Dans Azure DevOps Services, PublishPipelineArtifact@1 peut aussi être utilisé.
- task: PublishBuildArtifacts@1
  displayName: 'Publier les Excel en artefact'
  inputs:
    PathtoPublish: '$(excelOutputDirectory)'
    ArtifactName: 'ControlM_Excel'
    publishLocation: 'Container'
